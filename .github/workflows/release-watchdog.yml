name: Release watchdog

on:
  release:
    types: [published, released, prereleased, edited]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tinyjs.json
            .github/scripts/release-command.mjs
            .github/scripts/release-manifest.mjs
            .github/scripts/release-watchdog.mjs
          sparse-checkout-cone-mode: false

      - run: node .github/scripts/release-watchdog.mjs
        env:
          GH_TOKEN: ${{ github.token }}
