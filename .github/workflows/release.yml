name: Release

# Only main builds release drafts. The update key never reaches GitHub Actions.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new: ${{ steps.version.outputs.is-new }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tinyjs.json
            .github/scripts/release-manifest.mjs
          sparse-checkout-cone-mode: false

      - id: version
        run: |
          set -euo pipefail
          version=$(node .github/scripts/release-manifest.mjs version)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          elif [ "$?" -eq 2 ]; then
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not check release tags"
            exit 1
          fi

  release:
    needs: version
    if: needs.version.outputs.is-new == 'true'
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Check and test
        run: |
          bun run check
          bun run test

      - name: Write and validate the merged PR's release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Draft tags don't exist yet. Check all pages rather than relying on git tags.
          if ! gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -se --arg tag "v$VERSION" 'add | all(.tag_name != $tag)' >/dev/null; then
            echo "::error::Could not check drafts, or v$VERSION already has a release."
            exit 1
          fi
          pr=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" \
            | jq -c --arg sha "$GITHUB_SHA" \
              '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)][0] // empty')
          if [ -z "$pr" ]; then
            echo "::error::The version bump must be merged from a pull request into main."
            exit 1
          fi
          printf '%s\n\n%s\n' "$(jq -r .title <<< "$pr")" "$(jq -r '.body // ""' <<< "$pr")" > "$RUNNER_TEMP/notes.md"
          bun .github/scripts/release-notes.mjs "$RUNNER_TEMP/notes.md"

      - name: Install checksum-pinned TinyJS
        env:
          TINYJS_VERSION: v0.75.1
          TINYJS_SHA256: 4f70990877763ba3a621173e678a139cf6076eefca8b25b00e90079d0f90b37d
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tinyjs.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/tarwin/tinyjsapp/releases/download/$TINYJS_VERSION/tinyjs-macos-arm64.tar.gz"
          printf '%s  %s\n' "$TINYJS_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.tinyjs" "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.tinyjs" --strip-components 1
          ln -sf "$HOME/.tinyjs/tinyjs" "$HOME/.local/bin/tinyjs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import the macOS code-signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::Configure the Tor certificate using bun run release:secrets."
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/tor-signing.keychain-db"
          certificate="$RUNNER_TEMP/tor-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password=$(openssl rand -hex 16)
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -p codesigning "$keychain" | awk '/ 1\) / { print $2; exit }')
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]]
          printf 'TINYJS_SIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Build and package both architectures
        run: bun .github/scripts/package-release.mjs "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release"

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/tor-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GH_REPO" --draft \
            --target "$GITHUB_SHA" --title "Tor $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP"/release/*
          printf '### Tor %s is a draft\nVerify, sign, and publish on your Mac: %s\n' \
            "$VERSION" "\`bun run release:publish $VERSION\`" >> "$GITHUB_STEP_SUMMARY"
